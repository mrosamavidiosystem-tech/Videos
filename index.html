<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MOVS - Upload Videos</title>
    <script src="./coi-serviceworker.min.js"></script>
    <link rel="stylesheet" href="https://mrosamavidiosystem-tech.github.io/Videos/upl.css">
</head>
<body>
    <div class="card">
        <h1>🎥🔐 MOVS Upload</h1>
        <p>
            <small>
                FFmpeg.wasm + AES-256-GCM.
                الفيديو يتم تقسيمه إلى أجزاء مستهدفة مدتها 5 دقائق،
                وفي النهاية يتم إنشاء manifest.json.
            </small>
        </p>
        <label>UUID السري</label>
        <input id="uuid" class="code" type="text" placeholder="xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx" autocomplete="off">
        <button class="s" id="new">توليد UUID</button>
        <label>الفيديو</label>
        <input id="video" type="file" accept="video/*" >
        <button class="p" id="start" >🚀 تقسيم + تشفير + رفع</button>
        <button class="d" id="cancel" disabled >إلغاء</button>
        <div class="track">
            <div id="bar" class="bar" ></div>
        </div>
        <div id="status" class="status" >جاهز.</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/aws-sdk@2.1692.0/dist/aws-sdk.min.js"></script>
    <script src="https://mrosamavidiosystem-tech.github.io/Videos/crypto.js"></script>
    <script src="https://mrosamavidiosystem-tech.github.io/Videos/storj.js"></script>
    <script src="https://mrosamavidiosystem-tech.github.io/Videos/ffmpeg_2.js"></script>
    <script src="https://mrosamavidiosystem-tech.github.io/Videos/uploader.js"></script>
    <script src="https://mrosamavidiosystem-tech.github.io/Videos/manifest.js"></script>
    <script src="https://mrosamavidiosystem-tech.github.io/Videos/utils.js"></script>
    <script src="https://mrosamavidiosystem-tech.github.io/Videos/app_UPL.js"></script>

</body>
</html>
