<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOVS - Upload Videos</title>
<script src="./coi-serviceworker.min.js"></script>
<style>
body{margin:0;padding:25px;background:#0b1220;color:#f8fafc;font-family:Tahoma,Arial}
.card{max-width:850px;margin:auto;background:#111827;padding:24px;border-radius:18px}
input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:8px;border-radius:10px}
input{background:#0a1020;color:#fff;border:1px solid #334155}
button{border:0;font-weight:700;cursor:pointer}.p{background:#10b981}.s{background:#334155;color:#fff}.d{background:#ef4444;color:#fff}
.status{margin-top:15px;background:#0a1020;padding:14px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.bar{height:14px;background:#10b981;width:0}.track{background:#0a1020;border-radius:20px;overflow:hidden;margin-top:15px}
small{color:#aab4c3}
</style></head><body><div class="card">
<h1>🎥🔐 MOVS Upload</h1>
<p><small>GitHub Pages + FFmpeg.wasm + AES-256-GCM. الفيديو يُقسم إلى أجزاء مستهدفة 5 دقائق، ويُرفع كل جزء مشفرًا، ثم يُنشأ manifest.json.</small></p>

<label>UUID السري</label><input id="uuid" placeholder="xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx">
<button class="s" id="new">توليد UUID</button>

<label>الفيديو</label><input id="video" type="file" accept="video/*">

<button class="p" id="start">🚀 تقسيم + تشفير + رفع</button>
<button class="d" id="cancel" disabled>إلغاء</button>
<div class="track"><div id="bar" class="bar"></div></div>
<div id="status" class="status">جاهز.</div>
</div>

<script src="ffmpeg.js"></script>
<script>
"use strict";

/* ========= GITHUB ========= */
const TOKEN  = "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";
const OWNER  = "mrosamavidiosystem-tech";
const REPO   = "Videos";
const BRANCH = "main";
const FOLDER = "MrOsamaElKaluby";

/* ========= VIDEO / CRYPTO ========= */
const PART_SECONDS=300;
const MAX_SAFE_PART_BYTES=90*1024*1024;
const PBKDF2_ITERATIONS=300000;
const MAGIC=new TextEncoder().encode("MOVSENC1");
const HEADER_SIZE=21;

let ffmpeg=null,ready=false,cancelled=false,inputName=null;
const $=id=>document.getElementById(id);
const status=t=>$("status").textContent=t;
const progress=x=>$("bar").style.width=Math.max(0,Math.min(100,x))+"%";

function isUUID(x){return /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(x)}
function human(n){let u=["B","KB","MB","GB"],i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(n>=100?0:2)+" "+u[i]}
function hms(x){x=Math.floor(x);let h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return(h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function check(){if(cancelled)throw Error("تم إلغاء العملية.")}
function headers(){return{"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"}}

async function toB64(bytes){
  const r=new FileReader();
  return new Promise((ok,bad)=>{
    r.onload=()=>{let s=String(r.result),p=s.indexOf(",");p<0?bad(Error("Base64 failed")):ok(s.slice(p+1))}
    r.onerror=()=>bad(r.error||Error("FileReader failed")); r.readAsDataURL(new Blob([bytes]));
  });
}
async function sha256(bytes){const d=await crypto.subtle.digest("SHA-256",bytes);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function keyFromUUID(uuid,salt){
  const p=await crypto.subtle.importKey("raw",new TextEncoder().encode(uuid),{name:"PBKDF2"},false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:PBKDF2_ITERATIONS,hash:"SHA-256"},p,{name:"AES-GCM",length:256},false,["encrypt"]);
}
async function encrypt(raw,key,id,index){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const aad=new TextEncoder().encode(id+":part:"+index);
  const c=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv,additionalData:aad,tagLength:128},key,raw));
  const out=new Uint8Array(HEADER_SIZE+c.length);out.set(MAGIC,0);out[8]=1;out.set(iv,9);out.set(c,21);return out;
}
function duration(file){return new Promise((ok,bad)=>{let v=document.createElement("video"),u=URL.createObjectURL(file);v.preload="metadata";v.onloadedmetadata=()=>{let d=v.duration;URL.revokeObjectURL(u);v.remove();Number.isFinite(d)&&d>0?ok(d):bad(Error("تعذر معرفة مدة الفيديو"))};v.onerror=()=>{URL.revokeObjectURL(u);v.remove();bad(Error("تعذر قراءة الفيديو"))};v.src=u})}

async function toBlobURL(url, mimeType){
  const response = await fetch(url);
  if(!response.ok){
    throw new Error(`تعذر تحميل: ${url} (${response.status})`);
  }
  const buffer = await response.arrayBuffer();
  return URL.createObjectURL(new Blob([buffer], {type:mimeType}));
}

async function fetchFile(file){
  return new Uint8Array(await file.arrayBuffer());
}

async function loadFF(){
  if(ready)return;

  if(!window.crossOriginIsolated){
    throw Error(
      "crossOriginIsolated=false. تأكد من وجود ملفات الـService Worker ثم أعد تحميل GitHub Pages."
    );
  }

  if(!window.FFmpegWASM?.FFmpeg){
    throw Error(
      "لم يتم تحميل ffmpeg.js المحلي. ضع ffmpeg.js بجوار Upload_videos.html."
    );
  }

  ffmpeg = new FFmpegWASM.FFmpeg();

  ffmpeg.on("log", ({message}) => {
    console.debug("[FFmpeg]", message);
  });

  const base = "https://unpkg.com/@ffmpeg/core@0.12.10/dist/umd";

  status("⏳ تحميل FFmpeg Core...");

  await ffmpeg.load({
    coreURL: await toBlobURL(
      base + "/ffmpeg-core.js",
      "text/javascript"
    ),
    wasmURL: await toBlobURL(
      base + "/ffmpeg-core.wasm",
      "application/wasm"
    )
  });

  ready = true;
}
async function existingSHA(path){
  let e=path.split("/").map(encodeURIComponent).join("/");
  let u=`https://api.github.com/repos/${encodeURIComponent(OWNER)}/${encodeURIComponent(REPO)}/contents/${e}?ref=${encodeURIComponent(BRANCH)}`;
  let r=await fetch(u,{headers:headers()}); if(r.status===404)return null;
  let j=await r.json(); if(!r.ok)throw Error(`GitHub GET ${r.status}: ${j.message||""}`); return j.sha||null;
}
async function upload(path,bytes,message){
  check();if(bytes.length>MAX_SAFE_PART_BYTES)throw Error(`${path} أكبر من ${human(MAX_SAFE_PART_BYTES)}`);
  let b=await toB64(bytes),e=path.split("/").map(encodeURIComponent).join("/");
  let u=`https://api.github.com/repos/${encodeURIComponent(OWNER)}/${encodeURIComponent(REPO)}/contents/${e}`;
  let body={message,content:b,branch:BRANCH},sha=await existingSHA(path);if(sha)body.sha=sha;
  let r=await fetch(u,{method:"PUT",headers:headers(),body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(`GitHub PUT ${r.status}: ${j.message||JSON.stringify(j)}`);return j;
}
async function extract(start,len,out){
  try{await ffmpeg.deleteFile(out)}catch{}
  let rc=await ffmpeg.exec(["-ss",String(start),"-i",inputName,"-t",String(len),"-map","0","-c","copy","-movflags","+faststart","-avoid_negative_ts","make_zero",out]);
  if(rc!==0)throw Error("FFmpeg فشل في استخراج "+out);
  let d=await ffmpeg.readFile(out);if(!d?.length)throw Error("الجزء الناتج فارغ");return d;
}
async function start(){
  const uuid=$("uuid").value.trim(),file=$("video").files[0];cancelled=false;$("start").disabled=true;$("cancel").disabled=false;progress(0);
  try{
    if(!isUUID(uuid))throw Error("أدخل UUID v4 صحيحًا");
    if(!file)throw Error("اختر فيديو");
    if([TOKEN,OWNER,REPO].some(x=>x.includes("ضع_")||x.includes("اسم_")))throw Error("عدّل ثوابت GitHub داخل JavaScript");
    status("⏳ قراءة مدة الفيديو...");const dur=await duration(file),count=Math.ceil(dur/PART_SECONDS),id=crypto.randomUUID();
    const salt=crypto.getRandomValues(new Uint8Array(16)),saltB64=await toB64(salt);await loadFF();
    const ext=(file.name.split(".").pop()||"mp4").toLowerCase();inputName="input_"+id+"."+ext;
    status("⏳ إدخال الفيديو إلى FFmpeg...");await ffmpeg.writeFile(inputName,await fetchFile(file));
    const key=await keyFromUUID(uuid,salt),parts=[];
    for(let i=0;i<count;i++){
      check();let n=i+1,startSec=i*PART_SECONDS,len=Math.min(PART_SECONDS,dur-startSec),out=`part_${String(n).padStart(4,"0")}.mp4`;
      progress(i/count*100);status(`🎬 الجزء ${n}/${count}\n⏱ ${hms(startSec)} → ${hms(startSec+len)}\n⚙️ استخراج...`);
      let raw=await extract(startSec,len,out);status(`🔐 تشفير الجزء ${n}/${count}\nالحجم: ${human(raw.length)}`);
      let enc=await encrypt(raw,key,id,n);if(enc.length>MAX_SAFE_PART_BYTES)throw Error(`الجزء ${n} أكبر من 90MB بعد التشفير. اجعل الأجزاء أقصر أو استخدم bitrate أقل.`);
      let path=`${FOLDER}/${id}/${out}.enc`;status(`⬆️ رفع الجزء ${n}/${count}\n${human(enc.length)}`);await upload(path,enc,`Upload encrypted video part ${n}/${count}`);
      parts.push({index:n,file:out+".enc",path,startSeconds:startSec,durationSeconds:len,encryptedSize:enc.length,sha256:await sha256(enc)});
      try{await ffmpeg.deleteFile(out)}catch{} await new Promise(r=>setTimeout(r,0));progress(n/count*100);
    }
    try{await ffmpeg.deleteFile(inputName)}catch{}inputName=null;
    const manifest={version:1,system:"MOVS-Encrypted-Video",algorithm:"AES-256-GCM",kdf:{name:"PBKDF2-SHA256",iterations:PBKDF2_ITERATIONS,saltBase64:saltB64},video:{id,originalName:file.name,originalSize:file.size,mimeType:file.type||"video/mp4",durationSeconds:dur,targetPartSeconds:PART_SECONDS,partCount:parts.length},parts};
    const mb=new TextEncoder().encode(JSON.stringify(manifest,null,2));
    const mp=`${FOLDER}/${id}/manifest.json`;status("📝 رفع manifest.json...");await upload(mp,mb,"Create encrypted video manifest");
    progress(100);status(`✅ اكتملت العملية\n\nالفيديو: ${file.name}\nالأجزاء: ${count}\nالمجلد: ${FOLDER}/${id}/\nmanifest: ${mp}\n\n🔐 UUID لم يتم تخزينه في GitHub.`);
  }catch(e){console.error(e);status("❌ فشلت العملية\n\n"+e.message);if(inputName&&ffmpeg){try{await ffmpeg.deleteFile(inputName)}catch{}inputName=null}}
  finally{$("start").disabled=false;$("cancel").disabled=true}
}
$("new").onclick=()=>{$("uuid").value=crypto.randomUUID();console.log("MOVS UUID:",$("uuid").value)}
$("start").onclick=start;$("cancel").onclick=()=>{cancelled=true;$("cancel").disabled=true;status("⛔ إلغاء العملية...")};
window.addEventListener("load",()=>console.log("crossOriginIsolated =",crossOriginIsolated));
</script></body></html>
